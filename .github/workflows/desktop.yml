# Installers for Moviclone Studio (desktop/): a Windows .msi and setup .exe, and
# a macOS .dmg (universal: Apple silicon and Intel).
#
# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0),
# which also publishes a draft GitHub release with the installers, and on
# demand (Actions > Desktop installers > Run workflow), which keeps them as
# build artifacts only.
#
# Unsigned unless signing secrets are set (see desktop/README.md): Windows then
# shows a SmartScreen warning and macOS asks to allow the app in Privacy &
# Security on first start.

name: Desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: ''
            args: ''
            bundle: desktop/target/release/bundle
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: desktop/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      # Optional macOS signing and notarization (repository secrets).
      APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD_S: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID_S: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ${{ matrix.name }}

      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'desktop/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
            console.log('version', c.version);
          "

      - name: Use the macOS signing secrets, when set
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$APPLE_CERTIFICATE_B64" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_B64"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_S"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_S"
            } >> "$GITHUB_ENV"
            echo "Signing with $APPLE_SIGNING_IDENTITY_S"
          else
            echo "No APPLE_CERTIFICATE secret: building an unsigned app"
          fi
          if [ -n "$APPLE_ID_S" ]; then
            {
              echo "APPLE_ID=$APPLE_ID_S"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_S"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_S"
            } >> "$GITHUB_ENV"
            echo "Notarizing"
          fi

      - name: Test the desktop crate
        working-directory: desktop
        run: cargo test --locked --release

      - name: Build the installers
        working-directory: desktop
        run: cargo tauri build ${{ matrix.args }}

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: Moviclone-Studio-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error

      - name: Attach them to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Moviclone Studio ${{ github.ref_name }}
          files: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
