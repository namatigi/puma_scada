[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/check",
    "crates/import-movicon",
    "crates/movi",
    "crates/tagdb",
    "crates/driver-modbus",
    "crates/sim",
    "crates/gateway",
    "crates/historian",
    "crates/alarms",
    "crates/studio",
    "crates/rt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
moviclone-model = { path = "crates/model" }
moviclone-check = { path = "crates/check" }
moviclone-import-movicon = { path = "crates/import-movicon" }
moviclone-tagdb = { path = "crates/tagdb" }
moviclone-driver-modbus = { path = "crates/driver-modbus" }
moviclone-sim = { path = "crates/sim" }
moviclone-gateway = { path = "crates/gateway" }
moviclone-historian = { path = "crates/historian" }
moviclone-alarms = { path = "crates/alarms" }
moviclone-studio = { path = "crates/studio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
roxmltree = "0.20"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
futures-util = "0.3"
tokio-modbus = { version = "0.14", default-features = false, features = ["tcp", "tcp-server"] }
redb = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# redb is very slow unoptimized; the historian (and its tests) run in debug builds too.
[profile.dev.package.redb]
opt-level = 2

# Password hashing (studio users) is deliberately slow; unoptimized it takes
# seconds per hash, which makes debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
