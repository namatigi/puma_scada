# Alarms for the Petrogas loading manifold demo.
# Limits are tuned to the Moviclone simulator (crates/sim) so that the demo
# raises and clears alarms by itself every few minutes; see demo/README.md.

[[alarm]]
name = "FM01_HighFlow"
tag = "FM_01_MassFlow"
when = "above"
limit = 113.0
deadband = 2.0
delay_s = 3.0
severity = "high"
message = "Gasoline (FM_01) mass flow above 113 mTon/hr"
area = "Manifold"

[[alarm]]
name = "FM01_LowFlow"
tag = "FM_01_MassFlow"
when = "below"
limit = 10.0
deadband = 5.0
delay_s = 10.0
severity = "medium"
message = "Gasoline (FM_01) mass flow below 10 mTon/hr (loading stopped)"
area = "Manifold"

[[alarm]]
name = "FM01_DensityHigh"
tag = "FM_01_Density"
when = "above"
limit = 721.2
deadband = 0.3
delay_s = 5.0
severity = "medium"
message = "Gasoline (FM_01) density above 721.2 kg/m³ (off-spec)"
area = "Manifold"

[[alarm]]
name = "FM01_DensityLow"
tag = "FM_01_Density"
when = "below"
limit = 718.8
deadband = 0.3
delay_s = 5.0
severity = "medium"
message = "Gasoline (FM_01) density below 718.8 kg/m³ (off-spec)"
area = "Manifold"

[[alarm]]
name = "FM01_CommLoss"
tag = "FM_01_MassFlow"
when = "bad-quality"
delay_s = 2.0
severity = "critical"
message = "Gasoline (FM_01) flow meter not answering (bad quality)"
area = "Manifold"

[[alarm]]
name = "FM01_PressureHigh"
tag = "FM_01_External_Pressure"
when = "above"
limit = 6.15
deadband = 0.2
delay_s = 3.0
severity = "high"
message = "Gasoline (FM_01) external pressure above 6.15 bar"
area = "Manifold"

